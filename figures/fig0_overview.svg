<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="940" viewBox="0 0 1460 940" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#009E73"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D55E00"/>
    </marker>
    <style>
      .t  { font-size: 13px; fill: #111827; }
      .ts { font-size: 11px; fill: #4b5563; }
      .tn { font-size: 10px; fill: #6b7280; }
      .h  { font-size: 14.5px; font-weight: 600; fill: #111827; }
      .stage { font-size: 11px; font-weight: 700; fill: #9ca3af; letter-spacing: 1.4px; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.3; }
      .num { font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1460" height="940" fill="#fbfbfc"/>

  <text x="40" y="46" font-size="21" font-weight="700" fill="#111827">Retrieval-augmented ESM C embeddings for linear B-cell epitope prediction</text>
  <text x="40" y="70" class="ts">IEDB-derived retrieval database + knowledge-graph provenance context + multi-window CNN, with the controls that establish what the gain measures</text>

  <!-- ============ STAGE 1 : DATA ============ -->
  <text x="40" y="112" class="stage">1 · DATA</text>
  <rect x="40" y="124" width="205" height="86" rx="9" class="box"/>
  <text x="56" y="150" class="h">IEDB B-cell assays</text>
  <text x="56" y="171" class="t"><tspan class="num" fill="#0072B2">1,612,539</tspan> assay rows</text>
  <text x="56" y="190" class="tn">38.9% of sequences carry both labels</text>
  <text x="56" y="203" class="tn">across assays → resolved per sequence</text>

  <path d="M245 150 L295 150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M245 167 L270 167 L270 272 L295 272" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M245 184 L258 184 L258 392 L295 392" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>

  <rect x="295" y="124" width="232" height="56" rx="9" class="box"/>
  <text x="311" y="146" class="h">Benchmark split (iBCE-EL)</text>
  <text x="311" y="167" class="t">train 4,440 + 5,485 · test <tspan font-weight="700">1,110 + 1,408</tspan></text>

  <rect x="295" y="238" width="232" height="100" rx="9" class="box"/>
  <text x="311" y="260" class="h">Retrieval database</text>
  <rect x="311" y="272" width="200" height="22" rx="5" fill="#eaf4fb"/>
  <text x="319" y="287" class="t">positive partition · <tspan font-weight="700">19,003</tspan></text>
  <rect x="311" y="300" width="200" height="22" rx="5" fill="#fdeee4"/>
  <text x="319" y="315" class="t">negative partition · <tspan font-weight="700">222,569</tspan></text>
  <text x="311" y="333" class="tn">no benchmark sequence appears in it</text>

  <rect x="295" y="366" width="232" height="74" rx="9" class="box"/>
  <text x="311" y="388" class="h">Held-out breast-cancer set</text>
  <text x="311" y="408" class="t"><tspan font-weight="700">269</tspan> peptides (107 pos / 162 neg)</text>
  <text x="311" y="426" class="tn">CEA · MUC1 · BRCA1/2 · p53 · ER/PR · Ki-67</text>

  <!-- ============ STAGE 2 : REPRESENTATION ============ -->
  <text x="585" y="112" class="stage">2 · REPRESENTATION</text>
  <path d="M527 152 L580 152" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M527 288 L553 288 L553 200 L580 200" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M527 400 L566 400 L566 212 L580 212" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>

  <rect x="580" y="124" width="198" height="104" rx="9" class="box"/>
  <text x="596" y="146" class="h">ESM C 600M</text>
  <text x="596" y="166" class="t">per-residue embedding</text>
  <g>
    <rect x="596" y="176" width="14" height="38" rx="2" fill="#0072B2" opacity="0.85"/>
    <rect x="613" y="176" width="14" height="38" rx="2" fill="#0072B2" opacity="0.7"/>
    <rect x="630" y="176" width="14" height="38" rx="2" fill="#0072B2" opacity="0.55"/>
    <rect x="647" y="176" width="14" height="38" rx="2" fill="#0072B2" opacity="0.4"/>
    <rect x="664" y="176" width="14" height="38" rx="2" fill="#d1d5db"/>
    <text x="686" y="200" class="t">25 × 1152</text>
  </g>

  <!-- KG context -->
  <rect x="580" y="252" width="198" height="130" rx="9" class="box"/>
  <text x="596" y="274" class="h">KG context per DB item</text>
  <text x="596" y="294" class="ts">source antigen accession · 512</text>
  <text x="596" y="311" class="ts">antigen name · 512</text>
  <text x="596" y="328" class="ts">source organism · 128</text>
  <text x="596" y="350" class="t">one-hot 1155 → projection → 1152</text>
  <text x="596" y="370" class="tn">added at real residue positions, scale 0.484</text>

  <!-- ============ STAGE 3 : FUSION ============ -->
  <text x="836" y="112" class="stage">3 · RETRIEVAL &amp; FUSION</text>
  <path d="M778 176 L830 176" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M778 316 L804 316 L804 212 L830 212" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>

  <rect x="830" y="124" width="240" height="124" rx="9" class="box"/>
  <text x="846" y="146" class="h">Top-5 retrieval, L2</text>
  <text x="846" y="165" class="ts">exact search on the flattened 28,800-d vector</text>
  <text x="846" y="186" class="t">label-partitioned:</text>
  <text x="846" y="204" class="ts">positive query → positive partition</text>
  <text x="846" y="220" class="ts">negative query → negative partition</text>
  <text x="846" y="240" class="tn">self-matches masked on the breast-cancer set</text>

  <rect x="830" y="272" width="240" height="88" rx="9" fill="#f3f8ed" stroke="#009E73" stroke-width="1.5"/>
  <text x="846" y="294" class="h">Fusion</text>
  <text x="846" y="318" font-size="14" fill="#111827">fused = <tspan font-weight="700">r</tspan> · query + (1−<tspan font-weight="700">r</tspan>) · mean(top-5)</text>
  <text x="846" y="341" class="t">best tested <tspan font-weight="700">r = 0.3</tspan></text>
  <text x="846" y="355" class="tn">sweep: r = 0.9 → 0.909 · 0.5 → 0.966 · 0.3 → 0.982</text>

  <!-- ============ STAGE 4 : MODEL ============ -->
  <text x="1128" y="112" class="stage">4 · MODEL</text>
  <path d="M1070 186 L1122 186" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>
  <path d="M1070 316 L1096 316 L1096 212 L1122 212" stroke="#6b7280" stroke-width="1.4" marker-end="url(#a)" fill="none"/>

  <rect x="1122" y="124" width="298" height="236" rx="9" class="box"/>
  <text x="1138" y="146" class="h">MCNN (multi-window CNN)</text>
  <text x="1138" y="167" class="ts">parallel 1-D convolutions along the residue axis</text>
  <g>
    <rect x="1138" y="180" width="58" height="26" rx="5" fill="#eaf4fb" stroke="#0072B2" stroke-width="1"/>
    <text x="1167" y="197" class="t" text-anchor="middle">w = 2</text>
    <rect x="1204" y="180" width="58" height="26" rx="5" fill="#eaf4fb" stroke="#0072B2" stroke-width="1"/>
    <text x="1233" y="197" class="t" text-anchor="middle">w = 9</text>
    <rect x="1270" y="180" width="58" height="26" rx="5" fill="#eaf4fb" stroke="#0072B2" stroke-width="1"/>
    <text x="1299" y="197" class="t" text-anchor="middle">w = 11</text>
    <rect x="1336" y="180" width="58" height="26" rx="5" fill="#eaf4fb" stroke="#0072B2" stroke-width="1"/>
    <text x="1365" y="197" class="t" text-anchor="middle">w = 25</text>
  </g>
  <text x="1138" y="228" class="t">64 filters each → max-pool over positions</text>
  <text x="1138" y="249" class="t">concat → 3 × dense 128 (dropout 0.7)</text>
  <text x="1138" y="270" class="t">→ softmax</text>
  <line x1="1138" y1="284" x2="1404" y2="284" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1138" y="304" class="ts">Per-residue structure matters: the same ESM C</text>
  <text x="1138" y="320" class="ts">embeddings mean-pooled, with SVM / XGBoost / LR /</text>
  <text x="1138" y="336" class="ts">RF / KNN, reach at most <tspan font-weight="700" fill="#111827">0.678</tspan> AUC against</text>
  <text x="1138" y="352" class="ts"><tspan font-weight="700" fill="#111827">0.755</tspan> for the CNN.</text>

  <!-- ============ STAGE 5 : EVALUATION ============ -->
  <text x="40" y="500" class="stage">5 · TWO EVALUATION DIRECTIONS, INDEPENDENT TEST SET (1,110 + 1,408)</text>

  <rect x="40" y="514" width="560" height="104" rx="9" fill="#f7f7f8" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="58" y="538" class="h">Direction 1 — test set fused exactly like training</text>
  <text x="58" y="562" class="t">ESM C alone <tspan font-weight="700">0.755</tspan>  →  RAG r=0.3 <tspan font-weight="700">0.982</tspan>  →  RAG + KG <tspan class="num" fill="#009E73">0.998</tspan></text>
  <text x="58" y="586" class="ts">Sens 0.989 · Spec 0.975 · 9 FN and 46 FP of 2,518 · seed sd ±0.0001</text>
  <text x="58" y="606" class="tn">Choosing the retrieval partition requires the query's label, so this is not a deployable setting.</text>

  <rect x="620" y="514" width="560" height="104" rx="9" fill="#f7f7f8" stroke="#d1d5db" stroke-width="1.3"/>
  <text x="638" y="538" class="h">Direction 2 — test set left as raw ESM C</text>
  <text x="638" y="562" class="t">RAG + KG trained, raw test <tspan class="num" fill="#D55E00">0.676</tspan>  ·  without KG context <tspan font-weight="700">0.669</tspan></text>
  <text x="638" y="586" class="ts">Below the unfused baseline of 0.755 (−0.079, p = 1.4e−07)</text>
  <text x="638" y="606" class="tn">Training on r=0.3 puts 70% of the signal in the neighbours; removing it at test time is a distribution shift.</text>

  <!-- ============ STAGE 6 : CONTROLS ============ -->
  <text x="40" y="664" class="stage">6 · CONTROLS — WHAT THE GAIN MEASURES</text>

  <rect x="40" y="678" width="364" height="112" rx="9" class="box"/>
  <text x="58" y="702" class="h">Label-free retrieval</text>
  <text x="58" y="726" class="t">one pooled database of 241,572 peptides</text>
  <text x="58" y="750" class="t">gain over no fusion: <tspan class="num" fill="#D55E00">+0.003</tspan>  (p = 0.43)</text>
  <text x="58" y="776" class="tn">The partition choice, not retrieval, carries the signal.</text>

  <rect x="424" y="678" width="364" height="112" rx="9" class="box"/>
  <text x="442" y="702" class="h">Provenance in the benchmark</text>
  <text x="442" y="726" class="t">source antigen alone → AUC <tspan font-weight="700">0.876</tspan></text>
  <text x="442" y="744" class="t">source organism alone → AUC <tspan font-weight="700">0.814</tspan></text>
  <text x="442" y="768" class="tn">Sequence-only models never see it: a source-protein-disjoint</text>
  <text x="442" y="782" class="tn">split costs the CNN only 0.010 AUC.</text>

  <rect x="808" y="678" width="372" height="112" rx="9" class="box"/>
  <text x="826" y="702" class="h">Unseen antigens (breast cancer)</text>
  <text x="826" y="726" class="t">ESM C + MCNN <tspan class="num" fill="#009E73">0.741</tspan> · iBCE-EL <tspan font-weight="700">0.759</tspan></text>
  <text x="826" y="750" class="t">RAG + KG on raw test <tspan class="num" fill="#D55E00">0.468</tspan> (below chance)</text>
  <text x="826" y="776" class="tn">Self-retrieval masked; 98 of 269 sit in the database verbatim.</text>

  <!-- ============ BIOLOGY ============ -->
  <text x="1200" y="664" class="stage">7 · BIOLOGY</text>
  <rect x="1200" y="678" width="220" height="112" rx="9" fill="#fdf7ea" stroke="#E69F00" stroke-width="1.4"/>
  <text x="1216" y="700" class="h">No single epitope dimension</text>
  <text x="1216" y="719" class="ts">best of 1152: |d| = 0.304, AUC 0.587</text>
  <text x="1216" y="737" class="ts">median |d| = 0.068</text>
  <line x1="1216" y1="746" x2="1404" y2="746" stroke="#f0e0bd" stroke-width="1"/>
  <text x="1216" y="764" class="ts">β-turn <tspan font-weight="700">+0.257</tspan> · hydropathy <tspan font-weight="700">−0.243</tspan></text>
  <text x="1216" y="781" class="ts">hydrophilicity <tspan font-weight="700">+0.176</tspan> → exposed loops</text>

  <!-- conclusion strip -->
  <rect x="40" y="816" width="1380" height="80" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="58" y="842" class="h">Recommended configuration: ESM C 600M + MCNN, raw embeddings in, prediction out — no retrieval database at inference</text>
  <text x="58" y="864" class="t">Independent test <tspan font-weight="700">0.755</tspan> AUC · unseen breast-cancer antigens <tspan font-weight="700">0.741</tspan> · comparable to a retuned iBCE-EL ensemble (0.773)</text>
  <text x="58" y="884" class="tn">The retrieval and knowledge-graph results are reported as a cautionary case study: a database partitioned by the prediction target makes a hard benchmark look solved.</text>
</svg>
